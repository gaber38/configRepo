server:
  port: 8083

spring:
  application:
    name: auth

  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    org.springframework.security: TRACE

jwt:
  secret:
    key: LZxI4vNgRcPi3uDp4tOlApcJan9LnLiOKC9KDwYslWH
  accessToken:
    expiration: 900000
  refreshToken:
    expiration: 604800000
